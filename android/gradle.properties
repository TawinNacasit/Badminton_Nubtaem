# apkzlib uses the JVM locale's Calendar when writing ZIP timestamps. Thai locales
# select BuddhistCalendar (year 2569), which is outside the ZIP/MS-DOS date range.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
android.useAndroidX=true
android.nonTransitiveRClass=true

